aid: photys-therapeutics
name: Photys Therapeutics
description: >-
  Photys Therapeutics is a clinical-stage biopharmaceutical company in Waltham, Massachusetts
  advancing proximity-based, targeted protein modulation medicines across three heterobifunctional
  modalities: PROTAC-based protein degradation (lead program PHT-776/HPB-143, an oral IRAK4
  degrader that entered Phase I in August 2026 for autoimmune and inflammatory disease), PHICS
  (Phosphorylation-Inducing Chimeric Small molecules, partnered with Novo Nordisk since December
  2024 for cardiometabolic disease), and tPRIME for restoring protective proteins such as p53
  Y220C in oncology. Founded in 2022 out of Amit Choudhary's lab at the Broad Institute and
  Brigham and Women's Hospital with a $75M Series A led by MPM Capital and Longwood Fund. Photys
  operates no developer program and publishes no OpenAPI, GraphQL, AsyncAPI, WSDL or gRPC
  contract; its only machine-readable, agent-facing surface is the platform-provided Wix Site MCP
  endpoint served from its own host at www.photys.com/_api/mcp, which answers anonymously with
  nine tools over site content and business details.
